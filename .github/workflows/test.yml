name: CI

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/provision-with-micromamba@v15
        with:
          environment-name: ARIA-tools
          environment-file: environment.yml
          extra-specs: |
            python=3.10

      - name: install package in conda environment
        shell: bash -l {0}
        run: |
          python -m pip install -e . --no-build-isolation

      - name: run pre-commit checks
        shell: bash -l {0}
        run: |
          pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/provision-with-micromamba@v15
        with:
          environment-name: ARIA-tools
          environment-file: environment.yml
          extra-specs: |
            python=${{ matrix.python-version }}

      - name: install package in conda environment
        shell: bash -l {0}
        run: |
          python -m pip install -e . --no-build-isolation

      - name: run unit tests with coverage
        shell: bash -l {0}
        run: |
          python -m pytest tests/unit -q --cov=src/aria_tools --cov-report=term-missing --cov-report=xml

      - name: run integration tests
        shell: bash -l {0}
        run: |
          python -m pytest tests/integration -q --cov=src/aria_tools --cov-append --cov-report=term-missing --cov-report=xml

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.10'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
