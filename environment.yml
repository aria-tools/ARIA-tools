# create environment : conda env create -f environment.yml
# update dependencies: conda env update -f environment.yml
# remove environment : conda env remove -n ARIA-tools
# enter  environment : conda activate ARIA-tools
# exit   environment : conda deactivate
# Full ARIA-tools conda environment for runtime, repo work, and CI.
# This file intentionally includes conda-only geospatial libraries that do not
# belong in the pip-facing ``requirements.txt`` or ``pyproject.toml``.
name: ARIA-tools
channels:
  - conda-forge
dependencies:
  - affine
  - asf_enumeration>=0.4.0
  - asf_search>=12.0.3
  - boto3
  - dem_stitcher>=2.5.8
  - gdal>=3.7.0
  - h5py
  - hyp3_sdk>=7.7.6
  - libgdal-hdf5
  - libgdal-netcdf
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - pip
  - pre-commit
  - pyproj
  - pytest
  - pytest-cov
  - python>=3.8
  - python-dateutil
  - rasterio
  - rioxarray
  - requests
  - ruff
  - scipy>1.10.0
  - setuptools>=68
  - shapely
  - tile_mate>=0.0.12
  - tqdm
  - wheel
  - xarray
  # Optional documentation dependencies (install separately if needed):
  # - pip:
  #   - jupyterlab
  #   - jupyter_contrib_nbextensions
