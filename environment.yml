# create environment : conda env create -f environment.yml
# update dependencies: conda env update -f environment.yml
# remove environment : conda env remove -n ARIA-tools
# enter  environment : conda activate ARIA-tools
# exit   environment : conda deactivate
name: ARIA-tools
channels:
  - conda-forge
dependencies:
  - affine
  - arm_pyart
  - dask
  - dem_stitcher>=2.5.8
  - gdal>=3.7.0
  - h5py
  - joblib
  - libgdal-hdf5
  - libgdal-netcdf
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - parallel
  - pip
  - pyproj
  - pytest
  - python>=3.8,<3.14
  - python-dateutil
  - rasterio
  - rioxarray
  - requests
  - scipy>1.10.0
  - shapely
  - tile_mate>=0.0.12
  - xarray
  - hyp3_sdk>=7.7.6  # dependencies for ariaOrderASF --orderpairs / --statusjobs mode
  - pip:
    - "asf_search[asf-enumeration]>=12.0.3"  # ariaOrderASF --getpairs requires the asf-enumeration extra
  #for ARIA-tools-docs
  #- jupyterlab
  #- jupyter_contrib_nbextensions
