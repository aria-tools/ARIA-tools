# create environment : conda env create -f environment.yml
# update dependencies: conda env update -f environment.yml
# remove environment : conda env remove -n ARIA-tools
# enter  environment : conda activate ARIA-tools
# exit   environment : conda deactivate
# Contributor environment for repo work and CI.
# This environment intentionally includes optional command dependencies and
# test tooling; pyproject.toml remains the authoritative pip install surface.
name: ARIA-tools
channels:
  - conda-forge
dependencies:
  - affine
  - boto3               # optional: S3 direct download when running on AWS
  - dem_stitcher>=2.5.8
  - gdal>=3.7.0
  - h5py
  - libgdal-hdf5
  - libgdal-netcdf
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - pip
  - pyproj
  - pytest
  - python>=3.8,<3.14
  - python-dateutil
  - rasterio
  - rioxarray
  - requests
  - scipy>1.10.0
  - shapely
  - tile_mate>=0.0.12
  - xarray
  - hyp3_sdk>=7.7.6  # dependencies for ariaOrderASF --orderpairs / --statusjobs mode
  - asf_search >=12.0.3
  - asf_enumeration >=0.4.0
  - pip:
  #for ARIA-tools-docs
  #- jupyterlab
  #- jupyter_contrib_nbextensions
