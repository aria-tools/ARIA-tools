# create environment : conda env create -f environment.yml
# update dependencies: conda env update -f environment.yml
# remove environment : conda env remove -n ARIA-tools
# enter  environment : conda activate ARIA-tools
# exit   environment : conda deactivate
# Full ARIA-tools environment for runtime, repo work, and CI.
# The editable install is expected to use the same all-in dependency surface.
name: ARIA-tools
channels:
  - conda-forge
dependencies:
  - affine
  - boto3
  - dem_stitcher>=2.5.8
  - gdal>=3.7.0
  - h5py
  - libgdal-hdf5
  - libgdal-netcdf
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - pip
  - pre-commit
  - pyproj
  - pytest
  - pytest-cov
  - ruff
  - python>=3.8,<3.14
  - python-dateutil
  - rasterio
  - rioxarray
  - requests
  - scipy>1.10.0
  - setuptools>=68
  - shapely
  - tile_mate>=0.0.12
  - wheel
  - xarray
  - hyp3_sdk>=7.7.6
  - asf_search >=12.0.3
  - asf_enumeration >=0.4.0
  - pip:
  #for ARIA-tools-docs
  #- jupyterlab
  #- jupyter_contrib_nbextensions
